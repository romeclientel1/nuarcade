<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Vespara">
  <defs>
    <radialGradient id="vesparaThresholdLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e2b8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d6b274" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d6b274" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer archway -->
  <path d="M40,240 L40,100 L100,20 L160,100 L160,240" fill="none" stroke="#d6b274" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Middle archway -->
  <path d="M58,240 L58,112 L100,50 L142,112 L142,240" fill="none" stroke="#d6b274" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Inner archway (the threshold itself) -->
  <path d="M76,240 L76,124 L100,80 L124,124 L124,240" fill="none" stroke="#f3e2b8" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Light path down the passage's center axis -->
  <line x1="100" y1="118" x2="100" y2="196" stroke="#d6b274" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- Distant threshold light -->
  <circle cx="100" cy="200" r="16" fill="url(#vesparaThresholdLight)"/>
  <circle cx="100" cy="200" r="4.5" fill="#f3e2b8"/>

  <!-- Threshold / receding steps -->
  <line x1="30" y1="244" x2="170" y2="244" stroke="#d6b274" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="45" y1="250" x2="155" y2="250" stroke="#d6b274" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="60" y1="256" x2="140" y2="256" stroke="#d6b274" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Flanking celestial accent lines -->
  <line x1="15" y1="92" x2="15" y2="200" stroke="#d6b274" stroke-width="1.5" stroke-opacity="0.45"/>
  <line x1="185" y1="92" x2="185" y2="200" stroke="#d6b274" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="11" y="76" width="8" height="8" transform="rotate(45 15 80)" fill="#d6b274" opacity="0.6"/>
  <rect x="181" y="76" width="8" height="8" transform="rotate(45 185 80)" fill="#d6b274" opacity="0.6"/>
  <circle cx="15" cy="208" r="2.5" fill="#d6b274" opacity="0.5"/>
  <circle cx="185" cy="208" r="2.5" fill="#d6b274" opacity="0.5"/>

  <!-- Apex ornament -->
  <rect x="94" y="4" width="12" height="12" transform="rotate(45 100 10)" fill="#f3e2b8"/>
</svg>
