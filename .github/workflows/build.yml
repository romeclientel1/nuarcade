name: Build NuArcade

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install renderer dependencies
        run: cd renderer && npm install

      - name: Build renderer
        run: cd renderer && npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NuArcade-Windows-Installer
          path: dist/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install renderer dependencies
        run: cd renderer && npm install

      - name: Build renderer
        run: cd renderer && npm run build

      - name: Build Mac DMG
        run: npx electron-builder --mac --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NuArcade-Mac-DMG
          path: dist/*.dmg
          retention-days: 30