name: Build NuArcade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install

      - name: Build renderer
        working-directory: renderer
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Get version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuArcade-Windows-Installer
          path: dist/*.exe
          retention-days: 90

      - name: Delete existing release if present
        run: |
          gh release delete "v${{ steps.version.outputs.VERSION }}" --yes 2>$null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: NuArcade v${{ steps.version.outputs.VERSION }}
          body: |
            ## NuArcade v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download `NuArcade-Setup.exe` below
            2. Run the installer over the existing install (no uninstall needed)
            3. Launch NuArcade

            ### Requirements
            - Windows 10/11 64-bit
            - F: drive for games and emulators (configured automatically)
            - Individual emulators installed separately (links in the Setup Wizard)

            ### Supported Systems
            TeknoParrot, MAME, Model 2, Model 3, RetroArch, Project64, DuckStation, Flycast, PPSSPP, PCSX2, RPCS3, Xenia, Dolphin, Cemu, Ryujinx, Visual Pinball X, Steam, PC
          files: dist/*.exe
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
