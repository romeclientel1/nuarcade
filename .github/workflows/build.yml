name: Build NuArcade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync README version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/Current version: v[0-9.]*/Current version: v$VERSION/g" README.md
          echo "Synced README to v$VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install

      - name: Build renderer
        working-directory: renderer
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Get version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuArcade-Windows-Installer
          path: dist/*.exe
          retention-days: 90

      - name: Publish GitHub Release
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "v$version"
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1 -ExpandProperty FullName
          gh release delete $tag --yes 2>$null
          gh release create $tag $exe --title "NuArcade v$version" --notes "## NuArcade v$version`n`n### Installation`n1. Download NuArcade-Setup.exe below`n2. Run the installer over the existing install`n3. Launch NuArcade"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
